# OMP Workflow Template — Project Model Roles
# Install to: .omp/config.yml in your project directory.
# Gateway model IDs use ds/...; OMP selectors use omniroute/ds/....
# The external model catalog and provider credentials remain user-owned.

modelRoles:
  # Cheap Scout owns bounded read-only retrieval.
  cheap-scout: omniroute/ds/deepseek-v4-flash:xhigh

  # Tech Lead selects per-spawn effort: omitted for high, hi for xhigh.
  worker: omniroute/codex/gpt-5.6-sol:high

  # Reviewer never drops below xhigh.
  reviewer: omniroute/codex/gpt-5.6-sol:xhigh

retry:
  modelFallback: true
  usageAwareFallback: false
  fallbackChains:
    default: []
    cheap-scout:
      - omniroute/ds/deepseek-v4-pro:xhigh
    worker: []
    reviewer: []

task:
  enableEffort: true
  maxEffort: xhigh
