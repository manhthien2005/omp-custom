# Escalation Policy
# Defines when agents must stop and escalate to the Tech Lead or user.

policy: escalation
version: "1.0"

# ── When agents must stop and escalate to Tech Lead ───────────────────────────

escalate_to_tech_lead:
  - condition: "Verification fails after implementation"
    action: "Return agent-result with status=failed; include failure evidence; do not silently retry"

  - condition: "Task scope would need to expand to complete the objective"
    action: "Return status=blocked; describe required expansion; do not proceed beyond declared scope"

  - condition: "Root cause cannot be found after two targeted investigations"
    action: "Return status=partial; describe what was investigated; do not guess"

  - condition: "A dependency task has not completed"
    action: "Return status=blocked; name the dependency"

  - condition: "A quality gate reveals a BLOCKING issue"
    action: "Return review-result with decision=CHANGES_REQUESTED; do not self-merge"

# ── When Tech Lead must stop and escalate to user ─────────────────────────────

escalate_to_user:
  - condition: "A live OMP file modification is required"
    action: "Explain what change is needed and why. Wait for explicit user approval."

  - condition: "Credentials, API keys, or secrets are needed"
    action: "Describe what is needed and why. Wait for user to provide or confirm."

  - condition: "A destructive operation is required (data deletion, schema drop, force push)"
    action: "Describe the operation, its impact, and reversibility. Wait for explicit user confirmation."

  - condition: "A licensing conflict cannot be resolved"
    action: "Describe the conflict. Do not proceed with the affected mechanism."

  - condition: "The architecture would need to violate a stated constraint to complete the task"
    action: "Describe the conflict explicitly. Do not work around the constraint silently."

  - condition: "Risk level is CRITICAL"
    action: "Present the risk assessment and planned approach before proceeding."

# ── Never escalate for ────────────────────────────────────────────────────────

do_not_escalate_for:
  - "Minor implementation details with a clear project-consistent answer"
  - "Choosing between two syntactically equivalent implementations"
  - "File naming or formatting decisions where project conventions exist"
  - "Test framework selection when the project already uses one"
