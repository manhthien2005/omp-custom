    adoption_type: conceptual-inspiration
    notes: >
      Repository-map design principles adopted as concept. No code imported.

  - id: agents-md
    url: https://github.com/agentsmd/agents.md
    license: MIT
    spdx: MIT
    adoption_type: conceptual-inspiration
    notes: >
      AGENTS.md structural patterns used as inspiration. Content original.

  - id: serena
    url: https://github.com/oraios/serena
    license: MIT
    spdx: MIT
    adoption_type: linked-external-dependency
    notes: >
      Conditional tool. Evaluate only; not integrated in v0.

  - id: repomix
    url: https://github.com/yamadashy/repomix
    license: MIT
    spdx: MIT
    adoption_type: linked-external-dependency
    notes: >
      Conditional tool. Evaluate only; not integrated in v0.

  - id: context7
    url: https://github.com/upstash/context7
    license: MIT
    spdx: MIT
    adoption_type: linked-external-dependency
    notes: >
      Conditional MCP tool. Evaluate only; documented in retrieval-order policy.

