# License registry — all upstream repositories
# For each adopted mechanism: record whether it is conceptual-inspiration,
# paraphrased-implementation, adapted-content, copied-content, or linked-external-dependency.
# Generated: 2026-08-07

licenses:

  - id: oh-my-pi
    url: https://github.com/can1357/oh-my-pi
    license: MIT
    spdx: MIT
    adoption_type: conceptual-inspiration
    notes: >
      OMP is the runtime authority. We configure it; we do not copy its source code.
      Agent and skill file formats are OMP-native conventions (not copyrightable interfaces).
      AGENTS.md and config.yml are configuration files authored by this project.

  - id: superpowers
    url: https://github.com/obra/superpowers
    license: MIT
    spdx: MIT
    adoption_type: paraphrased-implementation
    notes: >
      systematic-debugging and verification-before-completion skill bodies are
      paraphrased and rewritten in project-native language. No verbatim copy of
      SKILL.md bodies. MIT license permits reuse with attribution; attribution
      recorded in adoption-ledger.yml.

  - id: anthropics-skills
    url: https://github.com/anthropics/skills
    license: per-skill  # no root LICENSE; 16 per-skill LICENSE.txt files
    spdx: Apache-2.0 AND LicenseRef-Anthropic-Proprietary
    adoption_type: conceptual-inspiration
    corrected_date: "2026-08-08"  # KD-023 / SD-12
    superseded_fields:
      license: no-license-file
      spdx: UNLICENSED
    notes: >
      No root LICENSE file, but licensing is declared per skill: 16 LICENSE.txt files
      exist. Verified at commit b29e7cf.

      Apache-2.0 (12, copying permitted with attribution): algorithmic-art,
      brand-guidelines, canvas-design, claude-api, frontend-design, internal-comms,
      mcp-builder, skill-creator, slack-gif-creator, theme-factory,
      web-artifacts-builder, webapp-testing.

      Proprietary / all-rights-reserved (4, DO NOT COPY): docx, pdf, pptx, xlsx.
      Their SKILL.md frontmatter says so explicitly ("license: Proprietary. LICENSE.txt
      has complete terms").

      THIRD_PARTY_NOTICES.md covers third-party components only.
      The SKILL.md format and progressive-disclosure pattern remain conceptual
      inspiration; skill-creator (the one we reference) is Apache-2.0, so copying it
      would be permitted with attribution if we ever chose to.
      Flag: per-skill check required before copying — the answer differs by skill.

  - id: spec-kit
    url: https://github.com/github/spec-kit
    license: MIT
    spdx: MIT
    adoption_type: paraphrased-implementation
    notes: >
      Constitution and spec template structures paraphrased and rewritten.
      No verbatim copy of template content. MIT license permits reuse with attribution.

  - id: openspec
    url: https://github.com/Fission-AI/OpenSpec
    license: MIT
    spdx: MIT
    adoption_type: conceptual-inspiration
    notes: >
      Delta-spec concept (ADDED/MODIFIED/REMOVED sections) and change-folder
      structure are adopted as architecture concepts. Artifacts in this project
      are original. No CLI code imported.

  - id: agent-skills-context-engineering
    url: https://github.com/muratcankoylan/Agent-Skills-for-Context-Engineering
    license: MIT
    spdx: MIT
    adoption_type: conceptual-inspiration
    notes: >
      Context-budget and retrieval-order policies inspired by this repository.
      Policy YAML files in this project are original.

  - id: addyosmani-agent-skills
    url: https://github.com/addyosmani/agent-skills
    license: MIT
    spdx: MIT
    adoption_type: conceptual-inspiration
    notes: >
      Quality-gate criteria extracted as concept list. Policy YAML files original.

  - id: promptfoo
    url: https://github.com/promptfoo/promptfoo
    license: MIT
    spdx: MIT
    adoption_type: linked-external-dependency
    notes: >
      Promptfoo used as optional external evaluation tool only. Not bundled.
      Evaluation fixture format inspired by promptfoo conventions.

  - id: ECC
    url: https://github.com/affaan-m/ECC
    license: MIT
    spdx: MIT
    adoption_type: conceptual-inspiration
    notes: >
      Pattern mine only. No code or content imported.

  - id: mini-swe-agent
    url: https://github.com/SWE-agent/mini-swe-agent
    license: MIT
    spdx: MIT
    adoption_type: conceptual-inspiration
    notes: >
      Minimal worker-loop principle used as complexity governor. No code imported.

  - id: andrej-karpathy-skills
    url: https://github.com/multica-ai/andrej-karpathy-skills
    license: MIT  # granted in-file, not via a root LICENSE file
    spdx: MIT
    adoption_type: conceptual-inspiration
    corrected_date: "2026-08-08"  # KD-023 / SD-12
    superseded_fields:
      license: no-license-file
      spdx: UNLICENSED
    notes: >
      MIT, granted in-file in three places at commit 2c60614:
      skills/karpathy-guidelines/SKILL.md:4 (`license: MIT`),
      .claude-plugin/plugin.json:8 (`"license": "MIT"`), and README.md:169-171
      (also README.zh.md). There is no root LICENSE file, which is why the original
      record read UNLICENSED — a license grant does not require that filename.

      The four Karpathy coding principles (think before coding, simplicity first,
      surgical changes, goal-driven execution) are general software engineering
      concepts. This project independently rewrote them; no verbatim copy was made.
      Copying would now be permitted with attribution, but is declined on cost
      grounds: the upstream text is ~410 tok against a 600-1,200 tok AGENTS.md budget.
      The prior "do not reproduce original wording" flag is withdrawn — it forbade
      something MIT permits.

  - id: 12-factor-agents
    url: https://github.com/humanlayer/12-factor-agents
    license: Apache-2.0 (code) / CC-BY-SA-4.0 (content)
    spdx: Apache-2.0 AND CC-BY-SA-4.0
    adoption_type: paraphrased-implementation
    notes: >
      Content (documentation, factor descriptions) is CC BY-SA 4.0.
